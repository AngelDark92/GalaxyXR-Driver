[package]
name = "galaxyxrdriver-gui"
version = "1.16.0"
description = "Galaxy XR Companion"
authors = ["hsin-yu chen"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1.0"

[dependencies]
# arbitrary_precision keeps out-of-f64 tokens (e.g. SteamVR's -1e+9999) parseable
# and byte-preserved; see driver_installation::setting_equal for comparisons.
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
sha2 = "0.10"
tauri = { version = "2.12", features = ["devtools", "tray-icon"] }
tauri-plugin-log = "2"
# Single instance (2026-10-20): a second launch signals the running Companion
# (including one minimised to the tray) and exits instead of opening a copy.
tauri-plugin-single-instance = "2"
tauri-plugin-fs = { version = "2.0.0", features = ["watch"] }
locale_config = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
sysinfo = "0.35.1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

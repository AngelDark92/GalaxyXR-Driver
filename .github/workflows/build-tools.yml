name: Build tool compatibility

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galaxy-xr-build-tools-${{ github.ref }}
  cancel-in-progress: true

# Deliberately independent of release.yml: installer compatibility is not a
# prerequisite for compiling with the hosted runner's already installed tools.
jobs:
  build-tools:
    name: Windows build tool tests (PowerShell 5.1 and 7)
    # An automation-token push of an already built release version needs no
    # second build. This condition cannot bypass GitHub's PR approval gate.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      REQUIRE_PORTABLE_POWERSHELL_TESTS: '1'
      REQUIRE_POWERSHELL_TESTS: '1'
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: GalaxyXRDriverGUI/package-lock.json

      - name: Verify build sources are tracked
        run: |
          node .\tools\verify-build-sources.cjs --require-tracked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The tool tests need no compiler. The service suites below also need
      # the GUI's locked TypeScript/Lit dependencies on a fresh runner.
      - name: Install service test dependencies
        working-directory: GalaxyXRDriverGUI
        run: npm ci

      # One invocation runs every test file, so a failed suite does not hide
      # the results of later suites.
      - name: Run build tool tests
        run: |
          $testFiles = @(Get-ChildItem -LiteralPath .\tools\tests -Filter '*.test.cjs' |
            Sort-Object Name | ForEach-Object FullName)
          if ($testFiles.Count -eq 0) { throw 'No build tool test files found' }
          node --test @testFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The GUI unit suite is not part of the release build (release.yml builds
      # and packages only); it runs here and locally at the end of a task.
      - name: Run frontend tests
        if: ${{ !cancelled() }}
        working-directory: GalaxyXRDriverGUI
        run: npm test

      - name: Run service and packaging regressions
        if: ${{ !cancelled() }}
        run: |
          $tests = @('Test-FluentFixes', 'Test-CompanionModes', 'Test-EncoderRestore', 'Test-AboutSetup',
            'Test-SectionCards', 'Test-FluentBuildHooks', 'Test-SourceUpdate')
          $failed = @()
          foreach ($test in $tests) {
            node ".\tools\$test.cjs"
            if ($LASTEXITCODE -ne 0) { $failed += $test }
          }
          if ($failed.Count) { throw "Failed suites: $($failed -join ', ')" }

      - name: Build production frontend entries
        if: ${{ !cancelled() }}
        working-directory: GalaxyXRDriverGUI
        run: npm run build:ui

      - name: Check packaged graph and bitrate monitor in WebView browser engine
        if: ${{ !cancelled() }}
        run: |
          # Keep QA dependencies outside source, like all other build tools.
          $browserTools = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '../builds/GalaxyXR-Driver/build/browser-qa-tools'))
          npm install --prefix $browserTools --no-save --package-lock=false playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NODE_PATH = Join-Path $browserTools 'node_modules'
          node .\tools\Test-CurvePreviewBrowser.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .\tools\Test-BitrateMonitorBrowser.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .\tools\Test-CompanionBrowser.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

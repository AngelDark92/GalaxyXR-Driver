name: Build and release GalaxyXRDriver

on:
  push:
    branches: ['**']
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the current version (main only; use to retry a release)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: galaxy-xr-release-${{ github.ref }}
  cancel-in-progress: false

# Build-only release pipeline (user policy, 2026-10-12): this workflow builds
# both portable packages, packages the Galaxy XR ZIP and publishes it. Unit,
# Rust, service and NVENC compile suites are deliberately NOT run here; run
# them locally at the end of a task (AGENTS.md "Build and verification") and
# see build-tools.yml for the CI tool/service suites.
jobs:
  build-windows-release:
    name: Windows x64 portable release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: GalaxyXRDriverGUI/package-lock.json

      - name: Prepare automatic version and changelog
        id: policy
        shell: pwsh
        run: node .\tools\release-policy.cjs

      # Build-tool compatibility tests run independently in build-tools.yml.
      # Release CI uses the runner's installed MSVC/SDK, not the local installer.
      - name: Prepare release inputs (CI layout v3)
        shell: pwsh
        run: |
          Write-Host "CI layout v3 - source commit: $env:GITHUB_SHA"
          node .\tools\prepare-native-dependencies.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Native dependency restoration failed' }
          node .\tools\prepare-native-dependencies.cjs --check
          if ($LASTEXITCODE -ne 0) { throw 'Native source preflight failed' }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # Both Tauri builds dominate this job. The registry cache holds the
      # downloaded crate sources and saves the fetch phase; the compiled crate
      # tree under the external output/GalaxyXRDriverGUI target dir is NOT
      # cached, because actions/cache rejects relative '..' patterns and
      # uploading the multi-GB tree costs more than the recompile it saves.
      - name: Restore Cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('GalaxyXRDriverGUI/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Verify release version
        id: version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          $version = & .\tools\Verify-ReleaseVersion.ps1 -Tag $tag -PassThru
          "version=$version" >> $env:GITHUB_OUTPUT
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Verify production NVENC OFF bypass and resource ownership
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\Test-NvencToggle.ps1 -UseCurrentEnvironment
          if errorlevel 1 exit /b 1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\Test-NvencPostPackOrder.ps1 -UseCurrentEnvironment
          if errorlevel 1 exit /b 1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\Test-GameLinkLayoutPolicy.ps1 -UseCurrentEnvironment
          if errorlevel 1 exit /b 1

      - name: Verify controller timing, dispatch, and layout velocity
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\Test-ControllerPoseEpoch.ps1 -UseCurrentEnvironment
          if errorlevel 1 exit /b 1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\Test-ControllerPoseVelocity.ps1 -UseCurrentEnvironment
          if errorlevel 1 exit /b 1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\Test-ControllerPoseDispatch.ps1 -UseCurrentEnvironment
          if errorlevel 1 exit /b 1

      - name: Install frontend dependencies
        working-directory: GalaxyXRDriverGUI
        shell: pwsh
        run: npm ci

      - name: Build neutral portable package
        shell: pwsh
        run: node .\build.js --vendor neutral

      - name: Build Galaxy XR portable package
        shell: pwsh
        run: node .\build.js --vendor galaxyxr

      - name: Create versioned ZIP, checksum, and release notes
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          .\tools\Package-GitHubRelease.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -Commit $env:RELEASE_COMMIT `
            -Tag $tag

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          path: ../builds/GalaxyXR-Driver/release/GalaxyXRDriver-v${{ steps.version.outputs.version }}-Windows-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload release metadata
        uses: actions/upload-artifact@v7
        with:
          name: GalaxyXRDriver-v${{ steps.version.outputs.version }}-release-metadata
          path: |
            ../builds/GalaxyXR-Driver/release/GalaxyXRDriver-v${{ steps.version.outputs.version }}-Windows-x64.zip.sha256
            ../builds/GalaxyXR-Driver/release/GalaxyXRDriver-v${{ steps.version.outputs.version }}-Windows-x64-release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Save verified version and changelog to main
        if: steps.policy.outputs.publish == 'true'
        id: persist
        shell: pwsh
        run: node .\tools\release-policy.cjs --persist

      - name: Publish GitHub Release
        if: steps.persist.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .\tools\publish-release.cjs

      - name: Upload native dependency diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-dependency-diagnostics-${{ github.run_id }}
          path: |
            ../builds/GalaxyXR-Driver/build/native-dependencies/*-fetch.log
            ../builds/GalaxyXR-Driver/build/native-dependencies/restoration-report.json
            ../builds/GalaxyXR-Driver/build/toolchains/logs/**
          if-no-files-found: ignore
          retention-days: 7

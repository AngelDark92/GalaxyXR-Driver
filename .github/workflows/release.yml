name: Build and release GalaxyXRDriver

on:
  push:
    branches: ['**']
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the current version (main or dev; use to retry a release)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: galaxy-xr-release-${{ github.ref }}
  cancel-in-progress: false

# Build-only release pipeline (user policy, 2026-10-12): this workflow builds
# both portable packages, packages the Galaxy XR ZIP and publishes it. Unit,
# Rust, service and NVENC compile suites are deliberately NOT run here; run
# them locally at the end of a task (AGENTS.md "Build and verification") and
# see build-tools.yml for the CI tool/service suites.
jobs:
  build-windows-release:
    name: Windows x64 portable release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: GalaxyXRDriverGUI/package-lock.json

      - name: Prepare automatic version and changelog
        id: policy
        shell: pwsh
        run: node .\tools\release-policy.cjs

      # Build-tool compatibility tests run independently in build-tools.yml.
      # Release CI uses the runner's installed MSVC/SDK, not the local installer.
      - name: Prepare release inputs (CI layout v3)
        shell: pwsh
        run: |
          Write-Host "CI layout v3 - source commit: $env:GITHUB_SHA"
          node .\tools\prepare-native-dependencies.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Native dependency restoration failed' }
          node .\tools\prepare-native-dependencies.cjs --check
          if ($LASTEXITCODE -ne 0) { throw 'Native source preflight failed' }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # Both Tauri builds dominate this job. The registry cache holds the
      # downloaded crate sources and saves the fetch phase; the compiled crate
      # tree under the external output/GalaxyXRDriverGUI target dir is NOT
      # cached, because actions/cache rejects relative '..' patterns and
      # uploading the multi-GB tree costs more than the recompile it saves.
      - name: Restore Cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('GalaxyXRDriverGUI/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Verify release version
        id: version
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          $version = & .\tools\Verify-ReleaseVersion.ps1 -Tag $tag -PassThru
          "version=$version" >> $env:GITHUB_OUTPUT
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        working-directory: GalaxyXRDriverGUI
        shell: pwsh
        run: npm ci

      - name: Build neutral portable package
        shell: pwsh
        run: node .\build.js --vendor neutral

      - name: Build Galaxy XR portable package
        shell: pwsh
        run: node .\build.js --vendor galaxyxr

      - name: Create versioned ZIP, checksum, and release notes
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          .\tools\Package-GitHubRelease.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -Commit $env:RELEASE_COMMIT `
            -Tag $tag

      # upload-artifact rejects patterns that leave the workspace ('..'), so the
      # external release directory is copied into the workspace first.
      - name: Stage release deliverables for upload
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $prefix = "GalaxyXRDriver-v$version-Windows-x64"
          $staging = Join-Path $env:GITHUB_WORKSPACE 'ci-artifacts'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $source = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '../builds/GalaxyXR-Driver/release'))
          foreach ($file in @("$prefix.zip", "$prefix.zip.sha256", "$prefix-release-notes.md")) {
            Copy-Item -LiteralPath (Join-Path $source $file) -Destination (Join-Path $staging $file) -Force
          }

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          path: ci-artifacts/GalaxyXRDriver-v${{ steps.version.outputs.version }}-Windows-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload release metadata
        uses: actions/upload-artifact@v7
        with:
          name: GalaxyXRDriver-v${{ steps.version.outputs.version }}-release-metadata
          path: |
            ci-artifacts/GalaxyXRDriver-v${{ steps.version.outputs.version }}-Windows-x64.zip.sha256
            ci-artifacts/GalaxyXRDriver-v${{ steps.version.outputs.version }}-Windows-x64-release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Save verified version and changelog to the release branch
        if: steps.policy.outputs.publish == 'true'
        id: persist
        shell: pwsh
        run: node .\tools\release-policy.cjs --persist

      - name: Publish GitHub Release
        if: steps.persist.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .\tools\publish-release.cjs

      # Dev channel (2026-10-13): after a stable publication on main, sync the
      # release commit back to dev. True merge: dev routinely advances past
      # the promotion merge while the release builds, so fast-forward-only
      # skips. Conflicting hunks resolve toward dev (-X ours); the next dev
      # release re-derives version and changelog from tags. Failures are loud
      # (2026-10-16): the previous warn-and-exit-0 step concluded success
      # while skipping the sync at both promotions, and dev kept numbering a
      # shipped base.
      - name: Backmerge main into dev
        if: steps.persist.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git fetch origin +refs/heads/dev:refs/remotes/origin/dev +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { echo '::error::Backmerge: could not fetch dev and main.'; exit 1 }
          git checkout -B dev origin/dev
          if ($LASTEXITCODE -ne 0) { echo '::error::Backmerge: could not check out origin/dev.'; exit 1 }
          git merge origin/main --no-edit -X ours -m 'chore: backmerge main into dev'
          if ($LASTEXITCODE -ne 0) { echo '::error::Backmerge: merging origin/main into dev failed; resolve dev and retry.'; exit 1 }
          git push origin dev
          if ($LASTEXITCODE -ne 0) { echo '::error::Backmerge: the push to dev was rejected.'; exit 1 }
          git fetch origin +refs/heads/dev:refs/remotes/origin/dev
          if ($LASTEXITCODE -ne 0) { echo '::error::Backmerge: could not re-fetch dev to verify the sync.'; exit 1 }
          if ((git rev-parse origin/dev) -ne (git rev-parse dev)) { echo '::error::Backmerge: origin/dev does not contain the merged release commit.'; exit 1 }

      - name: Stage native dependency diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE 'ci-diagnostics'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          # GetFullPath removes the '..' so Substring below slices the real path.
          $root = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '../builds/GalaxyXR-Driver'))
          $files = @()
          $files += Get-ChildItem -LiteralPath (Join-Path $root 'build/native-dependencies') -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like '*-fetch.log' -or $_.Name -eq 'restoration-report.json' }
          $files += Get-ChildItem -LiteralPath (Join-Path $root 'build/toolchains/logs') -File -Recurse -ErrorAction SilentlyContinue
          foreach ($file in $files) {
            $relative = $file.FullName.Substring($root.Length).TrimStart('\', '/')
            $target = Join-Path $staging $relative
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $target) | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $target -Force
          }

      - name: Upload native dependency diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-dependency-diagnostics-${{ github.run_id }}
          path: ci-diagnostics/**
          if-no-files-found: ignore
          retention-days: 7
